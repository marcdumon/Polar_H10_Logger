[project]
name = 'polar-h10'
version = '0.1.0'
description = 'Logs everything a Polar H10 chest strap sends over Bluetooth LE to CSV files, with a local API for live charts.'
readme = 'README.md'
requires-python = '>=3.13'
dependencies = [
    "bleak>=3.0.2",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "rich>=15.0.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
polar-h10 = 'polar_h10.cli:main'

[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[tool.setuptools]
package-dir = {'' = 'src'}

[tool.setuptools.packages.find]
where = ['src']

[tool.pytest.ini_options]
testpaths = ['tests']
addopts = '-q --tb=short'
asyncio_mode = 'auto'
pythonpath = ['tests']

[tool.ruff]
line-length = 135

[tool.ruff.lint]
select = ['E', 'F', 'I', 'B', 'UP', 'SIM', 'RUF']

[tool.ruff.format]
quote-style = 'single'

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]
